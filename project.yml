# XcodeGen spec. `make generate` writes AccentMirror.xcodeproj (git-ignored).
# Mac first, iOS right after: the iOS app target comes in a later spec.
name: AccentMirror

options:
  bundleIdPrefix: com.raphaelterrier
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # Stamps project.yml's hash into the generated project, so a build can tell when the project is stale
  # (see the "Check project is current" phase below). Runs on every `xcodegen generate`, including CI's.
  postGenCommand: shasum -a 256 project.yml | cut -d ' ' -f 1 > AccentMirror.xcodeproj/project.yml.sha256

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  AccentKit:
    path: Packages/AccentKit

targets:
  AccentMirror:
    type: application
    platform: macOS
    sources:
      - path: AccentMirror
        excludes:
          - Resources/Fonts
          - Resources/Fixtures
      # Bundled OFL fonts (spec 18), as a folder reference so each family's official OFL.txt stays next to
      # its font files in the app bundle (Contents/Resources/Fonts/<Family>/).
      - path: AccentMirror/Resources/Fonts
        type: folder
        buildPhase: resources
      # UI fixtures (spec 19): JSON states, phrases and takes, read with `-UIFixture <name>`.
      - path: AccentMirror/Resources/Fixtures
        type: folder
        buildPhase: resources
      # The starter library (spec 15): manifest, VCTK 0.92 native recordings (CC BY 4.0), word timings and analyses.
      # A folder reference, read-only in the bundle at Contents/Resources/Starter/.
      - path: Resources/Starter
        type: folder
        buildPhase: resources
    dependencies:
      - package: AccentKit
        product: AMPipeline
    preBuildScripts:
      # Fails the build when project.yml changed after the last `make generate` (XcodeGen writes the stamp).
      - name: Check project is current
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/project.yml
          - $(PROJECT_FILE_PATH)/project.yml.sha256
        script: |
          stamp="${PROJECT_FILE_PATH}/project.yml.sha256"
          current="$(shasum -a 256 "${SRCROOT}/project.yml" | cut -d ' ' -f 1)"
          if [ ! -f "$stamp" ] || [ "$(cat "$stamp")" != "$current" ]; then
            echo "error: project.yml changed: run make generate"
            exit 1
          fi
    postBuildScripts:
      # Spec 21: bundles the pinned speech model. Verifies the cached weights against Resources/Models/<model>/
      # manifest.json (scripts/fetch-models.sh --verify, never the network) and copies them, with the manifest,
      # LICENSE and NOTICE, into Contents/Resources/Models/<model>/, where the sandboxed app reads them. Without a
      # verified cache (CI, or before `make fetch-models`) it prints a note and the app shows the modelUnavailable
      # banner. Debug and Release alike. The cache is MODELS_CACHE (default .cache/models), outside the sources.
      - name: Bundle speech model
        basedOnDependencyAnalysis: false
        script: |
          model="openai_whisper-base.en"
          cache="${MODELS_CACHE:-${SRCROOT}/.cache/models}"
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Models/${model}"
          rm -rf "$dest"
          if ! MODELS_CACHE="$cache" "${SRCROOT}/scripts/fetch-models.sh" --verify "$model" >/dev/null 2>&1; then
            echo "note: ${model} is not fetched or not verified; the app will show the model-unavailable banner (run make fetch-models)"
            exit 0
          fi
          mkdir -p "$dest"
          ditto "${cache}/${model}/model" "$dest/model"
          ditto "${cache}/${model}/tokenizer" "$dest/tokenizer"
          for f in manifest.json LICENSE NOTICE; do cp "${SRCROOT}/Resources/Models/${model}/$f" "$dest/$f"; done
          echo "Bundled ${model} into ${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Models"
    settings:
      base:
        PRODUCT_NAME: AccentMirror
        PRODUCT_BUNDLE_IDENTIFIER: com.raphaelterrier.accentmirror
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Accent Mirror
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # Signing: automatic, no team. CI passes CODE_SIGNING_ALLOWED=NO (see Makefile).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # Spec 13: App Sandbox, microphone, user-selected read-only files. CI builds unsigned, so it never embeds them.
        CODE_SIGN_ENTITLEMENTS: AccentMirror/AccentMirror.entitlements
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Accent Mirror listens while you record a take. Your voice is analysed on this Mac and never leaves it."

  # Unhosted unit tests for the app's fixture layer (the Samples menu's names). No TEST_HOST: the few UI-free
  # files they need are compiled in, so running them never launches the app or opens a window.
  AccentMirrorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AccentMirrorTests
      - path: AccentMirror/Fixtures/FixtureLibrary.swift
      - path: AccentMirror/Fixtures/FixtureModel.swift
      - path: AccentMirror/Shell/LibraryManifest.swift
      # Spec 21: the live flow's UI-free files (presenter, session, playback render, menu table).
      - path: AccentMirror/Live/LivePresenter.swift
      - path: AccentMirror/Live/LiveSession.swift
      - path: AccentMirror/Live/AudioPlayback.swift
      - path: AccentMirror/Live/MenuTable.swift
      # v3.5: the Input popover's state and mic-check rules.
      - path: AccentMirror/Live/InputPanel.swift
      # v3.6 J2 / v3.7 K2–K3: the toolbar compact order and inspector width policy are UI-free.
      - path: AccentMirror/Toolbar/ToolbarCompaction.swift
      - path: AccentMirror/Toolbar/InspectorLayout.swift
      - path: AccentMirror/Toolbar/InputPopoverLayout.swift
      # v3.2 W3/W5: the token table, type roles, bundled fonts and the highlight box, all UI-free to test.
      - path: AccentMirror/Design/Palette.swift
      - path: AccentMirror/Design/Typography.swift
      - path: AccentMirror/Design/BundledFonts.swift
      - path: AccentMirror/Design/HighlightGeometry.swift
      - path: AccentMirror/Design/LabelLayout.swift
      - path: AccentMirror/Charts/ChartMotion.swift
      - path: AccentMirror/Fixtures/Copy.swift
      - path: AccentMirror/Shell/ToolbarState.swift
      - path: AccentMirror/Fixtures/ShellPresenter.swift
    dependencies:
      - package: AccentKit
        product: AMPipeline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raphaelterrier.accentmirror.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

  # Local-only screenshot runner (spec 19). Not built by the AccentMirror scheme, not run by CI or `make check`:
  # `make screenshots` runs it. Hosted by the app so it renders the real SwiftUI views in a 1200 × 800 pt window.
  AccentMirrorScreenshots:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AccentMirrorScreenshots
    dependencies:
      - target: AccentMirror
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raphaelterrier.accentmirror.screenshots
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

schemeTemplates:
  # Runs the app on one UI fixture (spec 19): pick "Fixture <name>" in Xcode and Run (⌘R).
  Fixture:
    shared: true
    build:
      targets:
        AccentMirror: [run]
    run:
      config: Debug
      commandLineArguments:
        "-UIFixture ${fixture}": true

schemes:
  # Build (⌘B) is what CI's `make build` runs: the app only. Test (⌘U) uses AccentMirror.xctestplan: the AccentKit
  # unit tests and AccentMirrorTests. They run in xctest with no host app, so ⌘U never opens a window. Test targets
  # are built for testing only, so `xcodebuild build` never builds them.
  AccentMirror:
    shared: true
    build:
      targets:
        AccentMirror: all
    test:
      config: Debug
      testPlans:
        - path: AccentMirror.xctestplan
          defaultPlan: true
  # App-hosted: the shell contract tests and the screenshot renderer (AccentMirrorScreenshots.xctestplan). Testing it
  # launches the app, so it runs in CI or the test VM, never on Raph's desktop (rule of 2026-11-23 11:48).
  AccentMirrorScreenshots:
    shared: true
    build:
      targets:
        AccentMirrorScreenshots: [test]
    test:
      config: Debug
      testPlans:
        - path: AccentMirrorScreenshots.xctestplan
          defaultPlan: true
  Fixture result-feedback:
    templates: [Fixture]
    templateAttributes:
      fixture: result-feedback
  Fixture empty:
    templates: [Fixture]
    templateAttributes:
      fixture: empty
  Fixture recording:
    templates: [Fixture]
    templateAttributes:
      fixture: recording
  Fixture tooQuiet:
    templates: [Fixture]
    templateAttributes:
      fixture: tooQuiet
  Fixture inc-requiredMeasureUnavailable-lowConfidence:
    templates: [Fixture]
    templateAttributes:
      fixture: inc-requiredMeasureUnavailable-lowConfidence
  Fixture ncd-insertionsPresent:
    templates: [Fixture]
    templateAttributes:
      fixture: ncd-insertionsPresent
  Fixture noVoicedFrames:
    templates: [Fixture]
    templateAttributes:
      fixture: noVoicedFrames
  Fixture tp-wordsDontMatch:
    templates: [Fixture]
    templateAttributes:
      fixture: tp-wordsDontMatch
  Fixture op-inferenceFailed:
    templates: [Fixture]
    templateAttributes:
      fixture: op-inferenceFailed
